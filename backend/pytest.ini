[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    unit: fast, isolated unit tests (no database, no HTTP server)
    integration: tests that use the HTTP stack and a test database
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
