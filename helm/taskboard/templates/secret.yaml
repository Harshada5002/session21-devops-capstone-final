---
# Secret: database credentials
# ⚠ IMPORTANT: This template provides a placeholder.
# For real deployments, create the secret manually BEFORE running helm install:
#
#   kubectl create secret generic taskboard-db-secret \
#     --namespace taskboard \
#     --from-literal=DATABASE_URL="postgresql+psycopg://user:pass@host:5432/db" \
#     --from-literal=POSTGRES_USER="user" \
#     --from-literal=POSTGRES_PASSWORD="pass" \
#     --from-literal=POSTGRES_DB="taskboard"
#
# Or use AWS Secrets Manager + External Secrets Operator for production.
apiVersion: v1
kind: Secret
metadata:
  name: taskboard-db-secret
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  # These placeholder values must be replaced before applying.
  # Never commit real credentials to Git.
  DATABASE_URL: "postgresql+psycopg://taskboard:REPLACE_PASSWORD@taskboard-postgresql:5432/taskboard"
  POSTGRES_USER:     "taskboard"
  POSTGRES_PASSWORD: "REPLACE_PASSWORD"
  POSTGRES_DB:       "taskboard"
