# values-prod.yaml – production environment overrides
backend:
  replicaCount: 3
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  env:
    ENVIRONMENT: "production"
    DEBUG: "false"
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 60

frontend:
  replicaCount: 2

ingress:
  host: "taskboard.yourdomain.com"   # REPLACE with your actual domain
  tls:
    - secretName: taskboard-tls
      hosts:
        - taskboard.yourdomain.com

postgresql:
  # For production: disable in-cluster PostgreSQL and use Amazon RDS instead.
  enabled: false
  # Configure the backend's DATABASE_URL secret to point to your RDS endpoint.
  persistence:
    size: 20Gi
