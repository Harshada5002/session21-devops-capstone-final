# Nginx configuration for TaskBoard frontend
# ------------------------------------------
# Serves the React SPA and proxies /api requests to the backend.
# In Docker Compose, "backend" resolves to the backend container.
# In Kubernetes, it resolves to the backend Service.

upstream taskboard_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # Serve the React application from the build output directory
    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static assets – cache for 1 year (Vite adds content hashes)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy /api requests to the FastAPI backend.
    # The browser never sees the internal backend hostname.
    location /api/ {
        proxy_pass         http://taskboard_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # Health check endpoint served directly by Nginx
    location /nginx-health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # SPA fallback: all other routes serve index.html
    # This allows React Router to handle client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
